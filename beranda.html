<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Saya - Cyber Mode</title>
    <style>
        /* --- 1. PENGATURAN UMUM (Sama dengan Index) --- */
        :root {
            --bg-color: #f0f4f8;
            --text-color: #1a202c;
            --primary-neon: #00bcd4; /* Cyan */
            --secondary-neon: #ff00ff; /* Pink */
            --glass: rgba(255, 255, 255, 0.8);
            --font-main: 'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            /* Pola Grid Background */
            background-image: 
                linear-gradient(rgba(0, 188, 212, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 188, 212, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- 2. CONTAINER KONTAK --- */
        .contact-card {
            background: var(--glass);
            width: 100%;
            max-width: 600px;
            padding: 3rem;
            border: 1px solid var(--text-color);
            box-shadow: 15px 15px 0px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* Header Hiasan */
        .header-bar {
            border-bottom: 2px dashed var(--text-color);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        /* Tombol Kembali (Kecil) */
        .back-link {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.9rem;
            border: 1px solid var(--text-color);
            padding: 5px 10px;
            transition: 0.3s;
        }
        .back-link:hover {
            background: var(--text-color);
            color: #fff;
        }

        /* --- 3. FORMULIR GAYA CYBER --- */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--primary-neon);
            font-size: 0.9rem;
        }

        /* Gaya Input & Textarea */
        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #ccc;
            font-family: var(--font-main);
            font-size: 1rem;
            transition: 0.3s;
            outline: none;
        }

        /* Efek saat diklik (Focus) */
        input:focus, textarea:focus {
            border-color: var(--secondary-neon);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
            background: #fff;
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        /* --- 4. TOMBOL KIRIM --- */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--primary-neon);
            color: var(--text-color);
            font-family: var(--font-main);
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: var(--primary-neon);
            color: #fff;
            box-shadow: 0 0 20px var(--primary-neon);
            border-color: var(--primary-neon);
        }

        /* --- 5. SOCIAL LINKS --- */
        .socials {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
        .socials span {
            display: inline-block;
            margin: 0 10px;
            padding: 5px;
            border-bottom: 1px solid transparent;
            cursor: pointer;
            transition: 0.3s;
        }
        .socials span:hover {
            color: var(--secondary-neon);
            border-bottom: 1px solid var(--secondary-neon);
        }

        @media (max-width: 600px) {
            .contact-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <div class="header-bar">
            <h2>Connect_System</h2>
            <a href="index.html" class="back-link">&lt; BACK</a>
        </div>

        <form action="https://formspree.io/f/mykdgzeb" method="POST">
            
            <div class="form-group">
                <label for="name">> INPUT_NAME:</label>
                <input type="text" id="name" name="nama" placeholder="Ketik namamu..." required>
            </div>

            <div class="form-group">
                <label for="email">> INPUT_EMAIL:</label>
                <input type="email" id="email" name="email" placeholder="email@contoh.com" required>
            </div>

            <div class="form-group">
                <label for="message">> DATA_MESSAGE:</label>
                <textarea id="message" name="pesan" placeholder="Tulis pesan rahasia di sini..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">INITIATE SEND</button>
        </form>

        <div class="socials">
            


            
        </div>
    </div>

    </body>

  </html>
